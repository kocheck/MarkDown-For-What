<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MarkDown For What</title>
</head>
<body>

    <!-- Tab bar -->
    <nav class="tab-bar">
        <button class="tab active" data-tab="import">Import</button>
        <button class="tab" data-tab="settings">Settings</button>
    </nav>

    <!-- Import tab -->
    <div id="tab-import" class="tab-panel active">

        <div class="import-color-block">
            <span class="plugin-wordmark">Markdown For What</span>

            <div id="drop-zone" class="drop-zone">
                <span class="drop-zone-icon">↓</span>
                <p class="drop-zone-label">Drop your Markdown here</p>
                <p class="drop-zone-sub">or click to browse · .md .markdown .txt</p>
                <input type="file" id="file-input" accept=".md,.markdown,.txt" multiple aria-label="Choose Markdown files">
            </div>
        </div>

        <ul id="file-list" class="file-list"></ul>

        <div class="bottom-bar">
            <p id="status-message" class="status-message"></p>
            <button id="import-btn" disabled>Import</button>
        </div>

    </div>

    <!-- Settings tab -->
    <div id="tab-settings" class="tab-panel hidden">

        <div class="settings-section">
            <h3 class="settings-section-title">Spacing</h3>
            <label class="settings-row">
                <span class="settings-label">Block spacing</span>
                <div class="settings-input-wrap"><input type="number" id="blockSpacing" min="0" max="200"><span class="settings-unit">px</span></div>
            </label>
            <label class="settings-row">
                <span class="settings-label">List spacing</span>
                <div class="settings-input-wrap"><input type="number" id="listSpacing" min="0" max="100"><span class="settings-unit">px</span></div>
            </label>
        </div>

        <div class="settings-section">
            <h3 class="settings-section-title">Frame</h3>
            <label class="settings-row">
                <span class="settings-label">Padding</span>
                <div class="settings-input-wrap"><input type="number" id="framePadding" min="0" max="200"><span class="settings-unit">px</span></div>
            </label>
            <label class="settings-row">
                <span class="settings-label">Width</span>
                <div class="settings-input-wrap"><input type="number" id="frameWidth" min="200" max="4000"><span class="settings-unit">px</span></div>
            </label>
        </div>

        <div class="settings-section">
            <h3 class="settings-section-title">Colors</h3>
            <label class="settings-row">
                <span class="settings-label">Code background</span>
                <div class="settings-input-wrap"><input type="text" id="codeBackground" maxlength="7" placeholder="#F2F2F2"><input type="color" class="color-swatch" id="codeBackground-swatch"></div>
            </label>
            <label class="settings-row">
                <span class="settings-label">Table header</span>
                <div class="settings-input-wrap"><input type="text" id="tableHeaderBackground" maxlength="7" placeholder="#F2F2F7"><input type="color" class="color-swatch" id="tableHeaderBackground-swatch"></div>
            </label>
            <label class="settings-row">
                <span class="settings-label">Separator</span>
                <div class="settings-input-wrap"><input type="text" id="separatorColor" maxlength="7" placeholder="#CCCCCC"><input type="color" class="color-swatch" id="separatorColor-swatch"></div>
            </label>
        </div>

        <div class="settings-footer">
            <button id="reset-btn" class="btn-secondary">Reset to defaults</button>
        </div>

    </div>

    <!-- Loading overlay -->
    <div id="loader" class="loader-overlay hidden">
        <div class="loader-content">
            <div class="spinner"></div>
            <p>Importing…<br>Please do not close this window.</p>
        </div>
    </div>

</body>
</html>
