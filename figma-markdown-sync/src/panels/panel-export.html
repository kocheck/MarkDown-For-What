<!-- Export Panel -->
<div class="tab-panel hidden" id="export-panel">
  <div class="export-content">
    <div class="export-file-info">
      <p id="export-filename" class="export-filename"></p>
      <p id="export-meta" class="export-meta"></p>
    </div>
    <div class="export-status-row" id="export-status-row">
      <span class="export-status-dot"></span>
      <span id="export-status-text" class="export-status-text">READY_TO_EXPORT</span>
    </div>
    <div class="export-log-card">
      <mfw-section-header label="EXPORT_LOG"></mfw-section-header>
      <div id="export-log-entries" class="export-log-entries"></div>
    </div>
  </div>
</div>
