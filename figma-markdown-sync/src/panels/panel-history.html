<!-- History Panel -->
<div class="tab-panel hidden" id="history-panel">
  <div class="history-content">
    <mfw-section-header label="RECENT IMPORTS"></mfw-section-header>
    <mfw-file-list id="history-file-list"></mfw-file-list>
    <p id="history-empty" class="history-empty-text hidden">No imports yet.</p>
    <div class="history-footer">
      <span id="history-count" class="history-count-text"></span>
      <mfw-button id="clear-history-btn" variant="destructive" label="Clear History"></mfw-button>
    </div>
  </div>
</div>
