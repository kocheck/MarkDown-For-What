<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MarkDown For What</title>
    <style>
/* ── Design tokens ────────────────────────────────────────── */
:root {
    --color-block:  #1B3543;
    --color-accent: #52C7A0;
}

/* ── Reset & base ─────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
    font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
    font-size: 12px;
    color: #333;
    background: #EFF4F2;
    height: 500px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
}

/* ── Tab bar ──────────────────────────────────────────────── */
.tab-bar {
    display: flex;
    border-bottom: 1px solid #D8E5E0;
    flex-shrink: 0;
    background: #EFF4F2;
}

.tab {
    flex: 1;
    padding: 10px;
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    border-radius: 0;
    cursor: pointer;
    font-size: 12px;
    font-weight: 500;
    color: #888;
    transition: color 0.15s, border-color 0.15s;
}

.tab:hover { color: #333; }

.tab.active {
    color: var(--color-block);
    border-bottom-color: var(--color-accent);
}

/* ── Tab panels ───────────────────────────────────────────── */
.tab-panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

.tab-panel.hidden { display: none; }

/* ── Import header ────────────────────────────────────────── */
.import-color-block {
    flex-shrink: 0;
    padding: 12px 16px 16px;
}

.plugin-wordmark {
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--color-block);
    margin-bottom: 10px;
    display: block;
}

/* ── Drop zone ────────────────────────────────────────────── */
.drop-zone {
    border: 1.5px dashed rgba(82, 199, 160, 0.5);
    border-radius: 8px;
    padding: 28px 16px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    flex-shrink: 0;
    position: relative;
    background: #E6EDEB;
}

.drop-zone:hover,
.drop-zone.drag-over {
    border-color: var(--color-accent);
    background: #DCE6E3;
}

.drop-zone input[type="file"] {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
}

.drop-zone-icon {
    font-size: 20px;
    margin-bottom: 8px;
    color: var(--color-accent);
}

.drop-zone-label {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.01em;
    color: var(--color-block);
    margin-bottom: 4px;
}

.drop-zone-sub {
    font-size: 11px;
    font-style: italic;
    color: #6B8E82;
}

/* ── File list ────────────────────────────────────────────── */
.file-list {
    list-style: none;
    overflow-y: auto;
    flex: 1;
    padding: 0 16px;
}

.file-list li {
    padding: 8px 0;
    border-bottom: 1px solid #F0F0F0;
    font-size: 11px;
    color: #555;
    display: flex;
    align-items: center;
    gap: 6px;
}

.file-list li::before {
    content: '';
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--color-accent);
    flex-shrink: 0;
}

/* ── Bottom bar ───────────────────────────────────────────── */
.bottom-bar {
    border-top: 1px solid #E5E5E5;
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
    background: #fff;
}

.status-message {
    flex: 1;
    font-size: 11px;
    color: #888;
}

.status-message.success { color: #18A449; }
.status-message.warning { color: #9B6E00; }
.status-message.error   { color: #D32F2F; }

/* ── Buttons ──────────────────────────────────────────────── */
button {
    font-family: inherit;
    font-size: 12px;
    cursor: pointer;
    border: none;
    border-radius: 6px;
    padding: 7px 14px;
    font-weight: 500;
    transition: background 0.15s;
}

#import-btn {
    background: var(--color-block);
    color: #fff;
    flex-shrink: 0;
}

#import-btn:hover:not(:disabled) { background: #243F52; }
#import-btn:disabled { background: #B0C4CE; cursor: default; }

.btn-secondary {
    background: none;
    border: 1px solid #E0E0E0;
    color: #555;
    font-size: 11px;
}

.btn-secondary:hover { background: #F5F5F5; }

#reset-btn {
    border-color: var(--color-accent);
    color: var(--color-accent);
}

#reset-btn:hover { background: rgba(82, 199, 160, 0.08); }

/* ── Settings ─────────────────────────────────────────────── */
#tab-settings {
    overflow-y: auto;
    padding: 8px 0;
    background: #fff;
}

.settings-section {
    padding: 12px 16px;
    border-bottom: 1px solid #F0F0F0;
}

.settings-section:last-of-type { border-bottom: none; }

.settings-section-title {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #999;
    margin-bottom: 10px;
    border-left: 2px solid var(--color-accent);
    padding-left: 8px;
}

.settings-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
    cursor: default;
}

.settings-row:last-child { margin-bottom: 0; }

.settings-label {
    font-size: 12px;
    color: #333;
}

.settings-input-wrap {
    display: flex;
    align-items: center;
    gap: 4px;
}

.settings-input-wrap input[type="number"],
.settings-input-wrap input[type="text"] {
    width: 72px;
    padding: 4px 6px;
    border: 1px solid #E0E0E0;
    border-radius: 4px;
    font-size: 12px;
    font-family: inherit;
    color: #333;
    text-align: right;
}

.settings-input-wrap input[type="number"]:focus,
.settings-input-wrap input[type="text"]:focus {
    outline: none;
    border-color: #0D99FF;
}

.settings-unit {
    font-size: 11px;
    color: #888;
    width: 16px;
}

.color-swatch {
    width: 24px;
    height: 24px;
    padding: 0;
    border: 1px solid #E0E0E0;
    border-radius: 50%;
    cursor: pointer;
    background: none;
    overflow: hidden;
    flex-shrink: 0;
}

.settings-footer {
    padding: 16px;
    display: flex;
    justify-content: flex-end;
}

/* ── Loader overlay ───────────────────────────────────────── */
.loader-overlay {
    position: fixed;
    inset: 0;
    background: rgba(255, 255, 255, 0.9);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
}

.loader-overlay.hidden { display: none; }

.loader-content {
    text-align: center;
    color: #555;
    font-size: 12px;
    line-height: 1.6;
}

.spinner {
    width: 24px;
    height: 24px;
    border: 2px solid #E0E0E0;
    border-top-color: #000;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin: 0 auto 12px;
}

@keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- Tab bar -->
    <nav class="tab-bar">
        <button class="tab active" data-tab="import">Import</button>
        <button class="tab" data-tab="settings">Settings</button>
    </nav>

    <!-- Import tab -->
    <div id="tab-import" class="tab-panel active">

        <div class="import-color-block">
            <span class="plugin-wordmark">Markdown For What</span>

            <div id="drop-zone" class="drop-zone">
                <span class="drop-zone-icon">&darr;</span>
                <p class="drop-zone-label">Drop your Markdown here</p>
                <p class="drop-zone-sub">or click to browse &middot; .md .markdown .txt</p>
                <input type="file" id="file-input" accept=".md,.markdown,.txt" multiple aria-label="Choose Markdown files">
            </div>
        </div>

        <ul id="file-list" class="file-list"></ul>

        <div class="bottom-bar">
            <p id="status-message" class="status-message"></p>
            <button id="import-btn" disabled>Import</button>
        </div>

    </div>

    <!-- Settings tab -->
    <div id="tab-settings" class="tab-panel hidden">

        <div class="settings-section">
            <h3 class="settings-section-title">Spacing</h3>
            <label class="settings-row">
                <span class="settings-label">Block spacing</span>
                <div class="settings-input-wrap"><input type="number" id="blockSpacing" min="0" max="200"><span class="settings-unit">px</span></div>
            </label>
            <label class="settings-row">
                <span class="settings-label">List spacing</span>
                <div class="settings-input-wrap"><input type="number" id="listSpacing" min="0" max="100"><span class="settings-unit">px</span></div>
            </label>
        </div>

        <div class="settings-section">
            <h3 class="settings-section-title">Frame</h3>
            <label class="settings-row">
                <span class="settings-label">Padding</span>
                <div class="settings-input-wrap"><input type="number" id="framePadding" min="0" max="200"><span class="settings-unit">px</span></div>
            </label>
            <label class="settings-row">
                <span class="settings-label">Width</span>
                <div class="settings-input-wrap"><input type="number" id="frameWidth" min="200" max="4000"><span class="settings-unit">px</span></div>
            </label>
        </div>

        <div class="settings-section">
            <h3 class="settings-section-title">Colors</h3>
            <label class="settings-row">
                <span class="settings-label">Code background</span>
                <div class="settings-input-wrap"><input type="text" id="codeBackground" maxlength="7" placeholder="#F2F2F2"><input type="color" class="color-swatch" id="codeBackground-swatch"></div>
            </label>
            <label class="settings-row">
                <span class="settings-label">Table header</span>
                <div class="settings-input-wrap"><input type="text" id="tableHeaderBackground" maxlength="7" placeholder="#F2F2F7"><input type="color" class="color-swatch" id="tableHeaderBackground-swatch"></div>
            </label>
            <label class="settings-row">
                <span class="settings-label">Separator</span>
                <div class="settings-input-wrap"><input type="text" id="separatorColor" maxlength="7" placeholder="#CCCCCC"><input type="color" class="color-swatch" id="separatorColor-swatch"></div>
            </label>
        </div>

        <div class="settings-footer">
            <button id="reset-btn" class="btn-secondary">Reset to defaults</button>
        </div>

    </div>

    <!-- Loading overlay -->
    <div id="loader" class="loader-overlay hidden">
        <div class="loader-content">
            <div class="spinner"></div>
            <p>Importing&hellip;<br>Please do not close this window.</p>
        </div>
    </div>

    <script>
    // ── DOM references ──────────────────────────────────────────────────────────
    var tabs = document.querySelectorAll('.tab');
    var tabPanels = document.querySelectorAll('.tab-panel');
    var dropZone = document.getElementById('drop-zone');
    var fileInput = document.getElementById('file-input');
    var fileList = document.getElementById('file-list');
    var importBtn = document.getElementById('import-btn');
    var statusMsg = document.getElementById('status-message');
    var loader = document.getElementById('loader');

    var settingInputIds = [
        'blockSpacing', 'listSpacing', 'framePadding', 'frameWidth',
        'codeBackground', 'tableHeaderBackground', 'separatorColor',
    ];

    // ── State ───────────────────────────────────────────────────────────────────
    var currentFiles = [];

    // ── Message bridge ──────────────────────────────────────────────────────────
    // Sketch uses sketch-module-web-view which provides window.postMessage
    // to communicate with the plugin backend. Messages are sent as strings.
    function sendToPlugin(msg) {
        window.postMessage('nativeLog', JSON.stringify(msg));
    }

    // ── Tab switching ───────────────────────────────────────────────────────────
    tabs.forEach(function(tab) {
        tab.addEventListener('click', function() {
            var targetId = 'tab-' + tab.dataset.tab;
            tabs.forEach(function(t) { t.classList.toggle('active', t === tab); });
            tabPanels.forEach(function(p) {
                p.classList.toggle('active', p.id === targetId);
                p.classList.toggle('hidden', p.id !== targetId);
            });
            if (tab.dataset.tab === 'settings') {
                sendToPlugin({ type: 'get-settings' });
            }
        });
    });

    // ── Drop zone ───────────────────────────────────────────────────────────────
    dropZone.addEventListener('dragover', function(e) {
        e.preventDefault();
        dropZone.classList.add('drag-over');
    });

    dropZone.addEventListener('dragleave', function() {
        dropZone.classList.remove('drag-over');
    });

    dropZone.addEventListener('drop', function(e) {
        e.preventDefault();
        dropZone.classList.remove('drag-over');
        if (e.dataTransfer && e.dataTransfer.files.length) handleFiles(e.dataTransfer.files);
    });

    fileInput.addEventListener('change', function() {
        if (fileInput.files && fileInput.files.length) handleFiles(fileInput.files);
    });

    // ── File handling ───────────────────────────────────────────────────────────
    var SUPPORTED_EXTENSIONS = ['.md', '.markdown', '.txt'];

    function hasSupportedExtension(filename) {
        var lower = filename.toLowerCase();
        return SUPPORTED_EXTENSIONS.some(function(ext) { return lower.endsWith(ext); });
    }

    function readFile(file) {
        return new Promise(function(resolve, reject) {
            var reader = new FileReader();
            reader.onload = function(e) { resolve({ name: file.name, content: e.target.result }); };
            reader.onerror = function() { reject(new Error('Failed to read ' + file.name)); };
            reader.readAsText(file);
        });
    }

    function handleFiles(files) {
        importBtn.disabled = true;
        showStatus('Reading files\u2026', 'success');

        var validFiles = Array.from(files).filter(function(f) { return hasSupportedExtension(f.name); });

        Promise.all(validFiles.map(readFile)).then(function(results) {
            currentFiles = results;
            renderFileList(currentFiles);

            if (currentFiles.length === 0) {
                showStatus('No valid Markdown files found.', 'error');
            } else {
                showStatus(currentFiles.length + ' file' + (currentFiles.length === 1 ? '' : 's') + ' ready', 'success');
                importBtn.disabled = false;
                importBtn.textContent = currentFiles.length === 1 ? 'Import' : 'Import ' + currentFiles.length + ' Files';
            }
        }).catch(function(err) {
            console.error('[MarkDown For What] Error reading files:', err);
            showStatus('Error reading files', 'error');
        });

        fileInput.value = '';
    }

    function renderFileList(files) {
        fileList.textContent = '';
        for (var i = 0; i < files.length; i++) {
            var li = document.createElement('li');
            li.textContent = files[i].name;
            fileList.appendChild(li);
        }
    }

    // ── Import ──────────────────────────────────────────────────────────────────
    importBtn.addEventListener('click', function() {
        if (currentFiles.length === 0) return;
        loader.classList.remove('hidden');
        importBtn.disabled = true;
        sendToPlugin({ type: 'import-markdown-batch', files: currentFiles });
    });

    // ── Settings ────────────────────────────────────────────────────────────────
    function populateSettings(settings) {
        if (!settings || typeof settings !== 'object') return;
        for (var i = 0; i < settingInputIds.length; i++) {
            var id = settingInputIds[i];
            var input = document.getElementById(id);
            if (!input || !(id in settings)) continue;
            input.value = String(settings[id]);
            var swatch = document.getElementById(id + '-swatch');
            if (swatch && typeof settings[id] === 'string') {
                swatch.value = settings[id];
            }
        }
    }

    function isValidHex(value) {
        return typeof value === 'string' && /^#[0-9A-Fa-f]{6}$/.test(value);
    }

    function sendCurrentSettings() {
        var settings = {};
        for (var i = 0; i < settingInputIds.length; i++) {
            var id = settingInputIds[i];
            var input = document.getElementById(id);
            if (!input) continue;
            settings[id] = input.type === 'number' ? Number(input.value) : input.value;
        }
        sendToPlugin({ type: 'save-settings', settings: settings });
    }

    function setupSettingListeners() {
        for (var i = 0; i < settingInputIds.length; i++) {
            (function(id) {
                var input = document.getElementById(id);
                var swatch = document.getElementById(id + '-swatch');

                if (input) {
                    input.addEventListener('change', function() {
                        sendCurrentSettings();
                        if (swatch && isValidHex(input.value)) {
                            swatch.value = input.value;
                        }
                    });
                }

                if (swatch) {
                    swatch.addEventListener('input', function() {
                        if (input) {
                            input.value = swatch.value;
                            sendCurrentSettings();
                        }
                    });
                }
            })(settingInputIds[i]);
        }

        var resetBtn = document.getElementById('reset-btn');
        if (resetBtn) {
            resetBtn.addEventListener('click', function() {
                sendToPlugin({ type: 'reset-settings' });
            });
        }
    }

    setupSettingListeners();

    // ── Status helper ───────────────────────────────────────────────────────────
    function showStatus(message, type) {
        statusMsg.textContent = message;
        statusMsg.className = 'status-message ' + (type || 'success');
    }

    // ── Plugin -> UI messages ─────────────────────────────────────────────────
    // sketch-module-web-view sends messages via window.addEventListener('message')
    // The plugin calls webContents.executeJavaScript() to invoke functions directly
    window.pluginMessage = function(msgString) {
        try {
            var msg = typeof msgString === 'string' ? JSON.parse(msgString) : msgString;

            switch (msg.type) {
                case 'status':
                    loader.classList.add('hidden');
                    importBtn.disabled = currentFiles.length === 0;
                    showStatus(msg.message, msg.error ? 'error' : msg.warning ? 'warning' : 'success');
                    break;
                case 'settings':
                    populateSettings(msg.settings);
                    break;
            }
        } catch (e) {
            console.error('[MarkDown For What] Error processing plugin message:', e);
        }
    };
    </script>

</body>
</html>
